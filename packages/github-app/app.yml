# GitHub App manifest for GhostDeps.
# https://docs.github.com/en/apps/sharing-github-apps/registering-a-github-app-from-a-manifest
#
# Least privilege. This file must match the permissions table in
# docs/github-app.md exactly; src/manifest.test.ts enforces that.
# Any change here is a product change: installers see this list.

name: GhostDeps
description: Finds dependencies your code doesn't really need. Reports through GitHub Checks, never gates.
url: https://github.com/rowkavdev/ghostdeps

hook_attributes:
  active: true

# installation and installation_repositories are delivered to every app and
# cannot be listed here. checks:write already subscribes the app to check_run
# and check_suite; check_run is listed explicitly because the re-run button
# (check_run.rerequested) is a behaviour we rely on.
default_events:
  - pull_request
  - push
  - check_run

default_permissions:
  contents: read
  pull_requests: read
  checks: write
  metadata: read
