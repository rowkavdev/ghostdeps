name: GhostDeps
description: >-
  Advisory dependency analysis (unused dependencies, native replacements,
  duplicate capability) as a check run. Wraps the ghostdeps CLI in your own
  Actions runner - no external service, nothing leaves the job.
author: rowkavdev
branding:
  icon: package
  color: purple
inputs:
  path:
    description: Directory to scan, relative to the workspace.
    required: false
    default: "."
  fail-on:
    description: >-
      Fail the step when any finding reaches this severity (critical, high,
      medium, low, info). Empty means advisory-only: the step never fails on
      findings, and the check run is still posted.
    required: false
    default: ""
  disable-rule:
    description: Comma-separated rule ids to turn off for the run.
    required: false
    default: ""
  allowlist:
    description: Comma-separated ecosystem:name entries to mark as expected tooling.
    required: false
    default: ""
  check-name:
    description: Name of the check run to create.
    required: false
    default: ghostdeps
  node-version:
    description: Node.js version to run the analysis with (ghostdeps requires >= 22).
    required: false
    default: "22"
  github-token:
    description: Token used to create the check run.
    required: false
    default: ${{ github.token }}
outputs:
  conclusion:
    description: Check conclusion that was posted (success or neutral).
    value: ${{ steps.post.outputs.conclusion }}
  scan-exit:
    description: Exit code of the ghostdeps CLI (0 = analysed, 1 = fail-on threshold hit).
    value: ${{ steps.scan.outputs.exit }}
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    # Build cache (#347). Correctness guards (lead):
    #  - the key covers the action COMMIT (not the ref name, which moves),
    #    the lockfile hash, the runner OS and the Node version, so a stale
    #    cache can never silently feed a different analysis;
    #  - exact key only, NO restore-keys: a partial match could serve a build
    #    of a different commit or lockfile as fresh, which is exactly the
    #    failure the key is designed against;
    #  - fail-open: restore errors are ignored, a restore that fails the
    #    smoke check below rebuilds from scratch, and save failures only warn.
    # The identity is a content hash of the action's source tree
    # (scripts/cache-key.sh), NOT git: remote `uses:` downloads have no .git.
    # Fail-closed: when the identity cannot be computed the restore and save
    # steps are skipped entirely - nothing is ever cached under "unknown".
    - name: Compute cache key
      id: cache-key
      shell: bash
      env:
        ACTION_ROOT: ${{ github.action_path }}/../..
        INPUT_NODE_VERSION: ${{ inputs.node-version }}
      run: |
        if hash=$(bash "${{ github.action_path }}/scripts/cache-key.sh" "$ACTION_ROOT"); then
          echo "key=ghostdeps-action-${{ runner.os }}-node${INPUT_NODE_VERSION}-${hash}" >> "$GITHUB_OUTPUT"
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::ghostdeps: no source identity - running without the build cache"
          echo "enabled=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Restore ghostdeps build cache
      if: steps.cache-key.outputs.enabled == 'true'
      id: cache
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        key: ${{ steps.cache-key.outputs.key }}
        path: |
          ${{ github.action_path }}/../../node_modules
          ${{ github.action_path }}/../../packages/*/node_modules
          ${{ github.action_path }}/../../packages/*/dist
          ${{ github.action_path }}/../../packages/adapters/*/node_modules
          ${{ github.action_path }}/../../packages/adapters/*/dist
    - name: Build ghostdeps
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
      run: |
        if [ "$CACHE_HIT" = "true" ] &&
           [ -f packages/cli/dist/main.js ] &&
           [ -f packages/action/dist/post-check.js ] &&
           [ -d node_modules/.pnpm ] &&
           node packages/cli/dist/main.js --help > /dev/null 2>&1; then
          echo "ghostdeps: using cached build"
          exit 0
        fi
        if [ "$CACHE_HIT" = "true" ]; then
          echo "::warning::ghostdeps: build cache failed verification - rebuilding from scratch"
        fi
        pnpm install --frozen-lockfile
        pnpm --filter @ghostdeps/cli... --filter @ghostdeps/action... build
    - name: Save ghostdeps build cache
      if: steps.cache-key.outputs.enabled == 'true' && steps.cache.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        key: ${{ steps.cache-key.outputs.key }}
        path: |
          ${{ github.action_path }}/../../node_modules
          ${{ github.action_path }}/../../packages/*/node_modules
          ${{ github.action_path }}/../../packages/*/dist
          ${{ github.action_path }}/../../packages/adapters/*/node_modules
          ${{ github.action_path }}/../../packages/adapters/*/dist
    # Inputs reach the shell ONLY through env vars below - never through
    # ${{ }} interpolation, which would execute metacharacters in them.
    - name: Scan
      id: scan
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        ACTION_ROOT: ${{ github.action_path }}/../..
        RESULT: ${{ runner.temp }}/ghostdeps-result.json
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_DISABLE_RULE: ${{ inputs.disable-rule }}
        INPUT_ALLOWLIST: ${{ inputs.allowlist }}
      run: |
        args=(scan --json "$INPUT_PATH")
        if [ -n "$INPUT_FAIL_ON" ]; then args+=(--fail-on "$INPUT_FAIL_ON"); fi
        IFS=',' read -ra rules <<< "$INPUT_DISABLE_RULE"
        for r in "${rules[@]}"; do [ -n "$r" ] && args+=(--disable-rule "$r"); done
        IFS=',' read -ra allow <<< "$INPUT_ALLOWLIST"
        for a in "${allow[@]}"; do [ -n "$a" ] && args+=(--allowlist "$a"); done
        set +e
        node "$ACTION_ROOT/packages/cli/dist/main.js" "${args[@]}" > "$RESULT"
        echo "exit=$?" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Post check run
      id: post
      if: always()
      shell: bash
      env:
        GHOSTDEPS_GITHUB_TOKEN: ${{ inputs.github-token }}
        GHOSTDEPS_CHECK_NAME: ${{ inputs.check-name }}
      run: node "${{ github.action_path }}/dist/post-check.js" "${{ runner.temp }}/ghostdeps-result.json"
    - name: Enforce --fail-on
      if: always()
      shell: bash
      env:
        SCAN_EXIT: ${{ steps.scan.outputs.exit }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
      run: |
        if [ "$SCAN_EXIT" = "1" ] && [ -n "$INPUT_FAIL_ON" ]; then
          echo "ghostdeps: findings at or above '$INPUT_FAIL_ON' (--fail-on)"
          exit 1
        fi
        if [ "$SCAN_EXIT" != "0" ]; then
          echo "::warning::ghostdeps exited $SCAN_EXIT - analysis did not complete; see the check run"
        fi
        exit 0
