version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/*"
      - "/packages/adapters/*"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    ignore:
      # Held at 5.9.x (ignore >=6): TS 7 removes the programmatic
      # createSourceFile API the JS adapter depends on. Migration tracked in #505.
      - dependency-name: "typescript"
        versions: [">=6"]
      # Held at 22.x (ignore >=23) while Node 22 is the engine baseline: the
      # 26 line breaks assert overloads and types runtime APIs we do not test.
      # Tracked in #506.
      - dependency-name: "@types/node"
        versions: [">=23"]
    # Test fixtures intentionally pin old, vulnerable and malformed manifests -
    # they are analysis inputs, not real dependencies. Excluding them stops
    # spurious security-update jobs (dependency_file_not_supported failures)
    # and fixture bump PRs while real manifests stay covered.
    exclude-paths:
      - "fixtures/**"
      - "packages/core/test/**"
      - "packages/github-app/test/**"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
  # Entries below exist only so their ecosystems honor exclude-paths for
  # fixture trees; open-pull-requests-limit 0 disables version-update PRs
  # (security updates still run, but skip the excluded fixture paths).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    exclude-paths:
      - "fixtures/**"
      - "packages/core/test/**"
      - "packages/github-app/test/**"
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    exclude-paths:
      - "fixtures/**"
      - "packages/core/test/**"
      - "packages/github-app/test/**"
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    exclude-paths:
      - "fixtures/**"
      - "packages/core/test/**"
      - "packages/github-app/test/**"
