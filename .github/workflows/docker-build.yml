name: Docker build

# Build the self-hosted app image on PRs only. This workflow never publishes it.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/docker-build.yml
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - packages/**

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build production image (no push)
        run: docker build --tag ghostdeps:ci .
      - name: Assert flagged fixture manifests are absent from runtime image
        run: |
          # Dockerfile copies pnpm's production deploy tree, not the source tree.
          # Fail if alerted first-party fixture manifests leak back.
          docker run --rm --entrypoint node ghostdeps:ci -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const root = "/app";
            const offenders = [];
            const coreDiffFixture = /\/@ghostdeps\/core\/test\/diffs\//;
            const repoFixture = /\/fixtures\/(?:python|hostile|polyglot|go|rust|js)\//;
            function walk(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const file = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(file);
                else if (entry.isFile() && (coreDiffFixture.test(file) || repoFixture.test(file)))
                  offenders.push(file);
              }
            }
            walk(root);
            if (offenders.length) {
              console.error("alert fixture leak in runtime image:", offenders.slice(0, 20));
              process.exitCode = 1;
            }
          '
      - name: Smoke-test bundled Probot CLI
        run: docker run --rm --entrypoint ./node_modules/.bin/probot ghostdeps:ci --help
