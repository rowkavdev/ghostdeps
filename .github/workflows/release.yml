name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stage (x.y.z); always published with --dry-run"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + --provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing needs npm >= 11.5.1; setup-node ships an older one.
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Resolve publish mode
        id: mode
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing malformed version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Stage the package
        env:
          STAGE_VERSION: ${{ steps.mode.outputs.version }}
        run: node scripts/stage-npm.mjs --version "$STAGE_VERSION"

      - name: Verify tarball contents
        working-directory: .npm-staging
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: .npm-staging
        # No token: trusted publishing authenticates via the workflow's OIDC
        # token. The first publish must be manual - npm only lets you
        # configure a trusted publisher for a package that already exists.
        # See docs/publishing.md.
        run: |
          dry=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            dry="--dry-run"
          fi
          npm publish --provenance --access public $dry
