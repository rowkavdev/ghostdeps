name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stage (x.y.z); always published with --dry-run"
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  pack:
    name: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.mode.outputs.version }}
      filename: ${{ steps.pack.outputs.filename }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Resolve publish mode
        id: mode
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing malformed version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Stage and pack the CLI-only artifact
        id: pack
        env:
          STAGE_VERSION: ${{ steps.mode.outputs.version }}
        run: |
          node scripts/stage-dist-prototype.mjs --version "$STAGE_VERSION" --out .npm-dist-prototype
          mkdir -p release-tarball
          npm pack --pack-destination release-tarball .npm-dist-prototype
          filename="ghost-deps-${STAGE_VERSION}.tgz"
          test -f "release-tarball/$filename"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "release-tarball/$filename" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-tarball
          path: release-tarball/*.tgz
          if-no-files-found: error
          retention-days: 7

  consumer:
    needs: pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.23
          no-cache: true
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: release-tarball
      - name: Verify packed bytes before consumer tests
        env:
          TARBALL: release-tarball/${{ needs.pack.outputs.filename }}
          EXPECTED_SHA256: ${{ needs.pack.outputs.sha256 }}
        run: node -e "const fs = require('node:fs'); const crypto = require('node:crypto'); const actual = crypto.createHash('sha256').update(fs.readFileSync(process.env.TARBALL)).digest('hex'); if (actual !== process.env.EXPECTED_SHA256) process.exit(1);"
      - name: Install exact tarball with npm and Bun, prune and reinstall
        env:
          STAGE_DIST_CONSUMER: "1"
          STAGE_DIST_TARBALL: release-tarball/${{ needs.pack.outputs.filename }}
        run: node --test scripts/stage-dist-consumer.test.mjs

  publish:
    needs: [pack, consumer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-tarball
          path: release-tarball
      - name: Verify exact tested bytes
        env:
          TARBALL: release-tarball/${{ needs.pack.outputs.filename }}
          EXPECTED_SHA256: ${{ needs.pack.outputs.sha256 }}
          EXPECTED_VERSION: ${{ needs.pack.outputs.version }}
        run: |
          echo "$EXPECTED_SHA256  $TARBALL" | sha256sum -c -
          test "$(tar -xOzf "$TARBALL" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')" = "$EXPECTED_VERSION"
      # Trusted publishing requires npm >= 11.5.1.
      - run: npm install --global npm@latest
      - name: Publish the tested tarball
        env:
          TARBALL: release-tarball/${{ needs.pack.outputs.filename }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            npm publish "./$TARBALL" --provenance --access public --dry-run
          else
            npm publish "./$TARBALL" --provenance --access public
          fi
