name: Staged consumer (experimental)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staged-consumer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consumer:
    name: consumer (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.2.23
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Clean npm and Bun consumer installs, prune, reinstall, workers and WASM
        env:
          STAGE_DIST_CONSUMER: "1"
        run: node --test scripts/stage-dist-consumer.test.mjs
